name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Сборке база и почта не нужны, но модули подключения проверяют, что переменные заданы.
    # Это заглушки только для CI: к реальной базе они не ведут, секрет нигде не используется.
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-0000000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: ESLint
        run: bun run lint
      - name: FSD architecture (Steiger)
        run: bun run lint:fsd
      - name: Prettier
        run: bun run format:check
      - name: Unit tests (Vitest)
        run: bun run test
      - name: Build
        run: bun run build

  # Docker-образы собираются в CI (без публикации): так Dockerfile проверяется на каждом push
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build app, migrator and realtime images
        run: |
          docker build --target app -t internhub-app .
          docker build --target migrator -t internhub-migrator .
          docker build --target realtime -t internhub-realtime .
      - name: Smoke-test realtime image
        run: |
          docker run -d --name realtime -e REALTIME_SECRET=ci -p 3001:3001 internhub-realtime
          sleep 3
          curl -fsS http://localhost:3001/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3001/publish)" = 401
      - name: Validate docker-compose.yml
        run: cp .env.production.example .env && POSTGRES_PASSWORD=ci docker compose config -q
